name: Database backup

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST daily
  workflow_dispatch: # "Run workflow" button for an on-demand backup

permissions:
  contents: read

concurrency: db-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --prod

      - name: Dump database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/backup.js dump

      # The repo is public and anyone signed in to GitHub can download its artifacts, so never upload plain data.
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1; }
          name="kilokhata-db-$(date -u +%Y-%m-%d)"
          tar -czf - dump | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$name.tar.gz.enc"
          rm -rf dump
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: backend/${{ env.BACKUP_NAME }}.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
